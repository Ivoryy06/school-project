<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kata Kunci: Teknologi Internet & Jaringan Komputer</title>
  <link rel="stylesheet" href="keywords.css" />
</head>
<body>

  <h1>🌐 Teknologi Internet & Jaringan Komputer</h1>
  <p class="subtitle">200 Kata Kunci — klik kartu untuk penjelasan, atau cari lebih via Google</p>

  <!-- ── Search bar ────────────────────────────────────────────────────────── -->
  <div class="search-bar">
    <input
      type="search"
      id="searchInput"
      placeholder="Cari kata kunci via Google… (kosong = tampilkan 200 default)"
      aria-label="Kata kunci pencarian"
    />
    <button class="btn-search" id="btnSearch" onclick="doSearch()">🔍 Cari</button>
  </div>

  <!-- ── Status bar ────────────────────────────────────────────────────────── -->
  <div class="status-bar" id="statusBar" role="status" aria-live="polite"></div>

  <!-- ── Stats ─────────────────────────────────────────────────────────────── -->
  <div class="stats">
    <span id="openCount">0</span> kartu terbuka dari <span id="totalCount">0</span>
  </div>

  <!-- ── Controls ──────────────────────────────────────────────────────────── -->
  <div class="controls">
    <button class="btn" onclick="expandAll()">↕ Buka Semua</button>
    <button class="btn" onclick="collapseAll()">↕ Tutup Semua</button>
    <button class="btn" onclick="showDefault()">🔄 Reset</button>
  </div>

  <!-- ── Results grid ───────────────────────────────────────────────────────── -->
  <div class="grid" id="grid"></div>

  <script src="keywords.js"></script>
</body>
</html>
